{{define "index_page"}}
<h1>Upload Bookmarks</h1>

<article>
    <h2>From file</h2>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="bookmarks" accept=".html,.htm,.json">
        <button type="submit">Upload</button>
    </form>
</article>

<article>
    <h2>From Chrome profile</h2>
    <form action="/upload" method="post">
        <label>
            Path to Bookmarks JSON or exported HTML:
            <input type="text" name="path" placeholder="~/Library/Application Support/Google/Chrome/Default/Bookmarks">
        </label>
        <button type="submit">Upload</button>
    </form>
</article>
{{end}}
