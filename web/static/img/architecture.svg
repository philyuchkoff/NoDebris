<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nodebris-title nodebris-desc" id="architecture-root">
        <title id="nodebris-title">NoDebris — архитектура очистителя закладок Chrome</title>
        <desc id="nodebris-desc">Схема компонентов проекта NoDebris: парсеры закладок, четыре анализатора, веб-сервер с UI и браузер пользователя.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'PT Sans', system-ui, sans-serif;
      --font-serif:    'PT Serif', 'Noto Serif', serif;
      --font-mono:     'PT Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ═══════════════════════════════════════════════════════════ -->
        <!-- ARROWS                                                        -->
        <!-- ═══════════════════════════════════════════════════════════ -->

        <!-- 1. Chrome → Parser -->
        <line x1="184" y1="96" x2="220" y2="96" stroke="#4f5d75" stroke-width="1" marker-end="url(#architecture-arrow)"/>
        <rect x="190" y="78" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="87" fill="#5a6580" font-size="8" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ЗАГР</text>

        <!-- 2. Parser → Bookmarks -->
        <line x1="356" y1="96" x2="392" y2="96" stroke="#4f5d75" stroke-width="1" marker-end="url(#architecture-arrow)"/>
        <rect x="362" y="78" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="376" y="87" fill="#5a6580" font-size="8" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ПАРС</text>

        <!-- 3. Bookmarks → Duplicates (left+down, routing y=172) -->
        <path d="M 434,124 V 164 Q 434,172 426,172 H 248 Q 240,172 240,180 V 240 Q 240,248 248,248"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#architecture-arrow)"/>

        <!-- 4. Bookmarks → Link Checker (left+down, routing y=184) -->
        <path d="M 468,124 V 176 Q 468,184 460,184 H 408 Q 400,184 400,192 V 240 Q 400,248 408,248"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#architecture-arrow)"/>

        <!-- 5. Bookmarks → Categorizer (right+down, routing y=172) -->
        <path d="M 500,124 V 164 Q 500,172 508,172 H 552 Q 560,172 560,180 V 240 Q 560,248 552,248"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#architecture-arrow)"/>

        <!-- 6. Bookmarks → Structure (right+down, routing y=184) -->
        <path d="M 536,124 V 176 Q 536,184 544,184 H 712 Q 720,184 720,192 V 240 Q 720,248 712,248"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#architecture-arrow)"/>

        <!-- 7. Bookmarks → Web Server (accent, main flow) -->
        <line x1="568" y1="96" x2="604" y2="96" stroke="#bf4520" stroke-width="1" marker-end="url(#architecture-arrow-accent)"/>
        <rect x="574" y="78" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="588" y="87" fill="#bf4520" font-size="8" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ОТРС</text>

        <!-- 8. Web Server → Browser (link, dashed — HTMX + export) -->
        <line x1="772" y1="96" x2="808" y2="96" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#architecture-arrow-link)"/>
        <rect x="778" y="78" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="792" y="87" fill="#2e5aa8" font-size="8" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UI+Э</text>

