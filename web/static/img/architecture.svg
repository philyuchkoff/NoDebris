        <text x="876" y="99" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Браузер</text>
        <text x="876" y="113" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">HTMX · PicoCSS</text>

        <!-- 6. Duplicates (backend) -->
        <rect x="172" y="248" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="172" y="248" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="180" y="254" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="206" y="263" fill="#2d3142" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">АНАЛИЗ</text>
        <text x="240" y="275" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Дубликаты</text>
        <text x="240" y="289" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">NormalizeURL</text>

        <!-- 7. Link Checker (backend) -->
        <rect x="332" y="248" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="332" y="248" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="340" y="254" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="366" y="263" fill="#2d3142" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">АНАЛИЗ</text>
        <text x="400" y="275" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Битые ссылки</text>
        <text x="400" y="289" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">HEAD→GET · x10</text>

        <!-- 8. Categorizer (backend) -->
        <rect x="492" y="248" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="492" y="248" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="500" y="254" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="526" y="263" fill="#2d3142" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">АНАЛИЗ</text>
        <text x="560" y="275" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Категории</text>
        <text x="560" y="289" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">Domain → Rule</text>

        <!-- 9. Structure (backend) -->
        <rect x="652" y="248" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="652" y="248" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="660" y="254" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="686" y="263" fill="#2d3142" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">АНАЛИЗ</text>
        <text x="720" y="275" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Структура</text>
        <text x="720" y="289" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">depth · count</text>

