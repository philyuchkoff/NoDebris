        <!-- NODES                                                         -->
        <!-- ═══════════════════════════════════════════════════════════ -->

        <!-- 1. Chrome Bookmarks (input) -->
        <rect x="40" y="72" width="144" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="72" width="144" height="48" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="48" y="78" width="40" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="68" y="87" fill="#5a6580" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">ИСТОЧНИК</text>
        <text x="112" y="99" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Закладки Chrome</text>
        <text x="112" y="113" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">HTML · JSON</text>

        <!-- 2. Parser (backend) -->
        <rect x="228" y="72" width="128" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="228" y="72" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="236" y="78" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="262" y="87" fill="#2d3142" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">ПАРСЕР</text>
        <text x="292" y="99" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Парсер</text>
        <text x="292" y="113" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">regex · JSON tree</text>

        <!-- 3. Bookmarks State (focal + store) -->
        <rect x="400" y="64" width="168" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="64" width="168" height="60" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="408" y="70" width="48" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="432" y="79" fill="#bf4520" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">СОСТОЯНИЕ</text>
        <text x="484" y="93" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Состояние закладок</text>
        <text x="484" y="109" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">[]Bookmark</text>

        <!-- 4. Web Server (backend) -->
        <rect x="612" y="72" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="612" y="72" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="620" y="78" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="646" y="87" fill="#2d3142" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">СЕРВЕР</text>
        <text x="692" y="99" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Веб-сервер</text>
        <text x="692" y="113" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">:8080 · 12 handlers</text>

        <!-- 5. Browser (external) -->
        <rect x="816" y="72" width="120" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="816" y="72" width="120" height="48" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="824" y="78" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.15"/>
