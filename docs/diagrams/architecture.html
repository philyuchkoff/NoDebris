<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoDebris — архитектура</title>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital@0;1&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'PT Sans', system-ui, sans-serif;
      --font-serif:    'PT Serif', 'Noto Serif', serif;
      --font-mono:     'PT Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Архитектура · Diagram Design</p>
    <h1>NoDebris — очиститель закладок Chrome</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nodebris-title nodebris-desc">
        <title id="nodebris-title">NoDebris — архитектура очистителя закладок Chrome</title>
        <desc id="nodebris-desc">Схема компонентов проекта NoDebris: парсеры закладок, анализаторы дубликатов, битых ссылок, категоризации и структуры папок, веб-сервер с UI и экспорт в Netscape HTML.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ═══════════════════════════════════════════════════════════ -->
        <!-- ARROWS (drawn before nodes)                                -->
        <!-- ═══════════════════════════════════════════════════════════ -->

        <!-- 1. Chrome → Parser -->
        <line x1="184" y1="96" x2="216" y2="96" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="186" y="80" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="208" y="89" fill="#5a6580" font-size="8" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UPLOAD</text>

        <!-- 2. Parser → Bookmarks -->
        <line x1="352" y1="96" x2="384" y2="96" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="354" y="80" width="34" height="12" rx="2" fill="#f5f5f5"/>
        <text x="371" y="89" fill="#5a6580" font-size="8" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PARSE</text>

        <!-- 3. Bookmarks → Duplicates (left+down elbow) -->
        <path d="M 428,124 V 172 Q 428,180 420,180 H 252 Q 244,180 244,188 V 240 Q 244,248 252,248"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- 4. Bookmarks → Link Checker (left+down elbow) -->
        <path d="M 464,124 V 172 Q 464,180 456,180 H 412 Q 404,180 404,188 V 240 Q 404,248 412,248"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- 5. Bookmarks → Categorizer (right+down elbow) -->
        <path d="M 500,124 V 172 Q 500,180 508,180 H 556 Q 564,180 564,188 V 240 Q 564,248 556,248"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- 6. Bookmarks → Structure (right+down elbow) -->
        <path d="M 536,124 V 172 Q 536,180 544,180 H 716 Q 724,180 724,188 V 240 Q 724,248 716,248"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- 7. Bookmarks → Web Server (accent, main flow) -->
        <line x1="560" y1="96" x2="592" y2="96" stroke="#bf4520" stroke-width="1" marker-end="url(#arrow-accent)"/>
        <rect x="562" y="80" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="582" y="89" fill="#bf4520" font-size="8" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RENDER</text>

        <!-- 8. Web Server → Browser (link, dashed — UI response) -->
        <line x1="760" y1="96" x2="792" y2="96" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <rect x="758" y="76" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="780" y="85" fill="#2e5aa8" font-size="8" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTMX+UI</text>

        <!-- ═══════════════════════════════════════════════════════════ -->
        <!-- NODES                                                      -->
        <!-- ═══════════════════════════════════════════════════════════ -->

        <!-- 1. Chrome Bookmarks (input) -->
        <rect x="40" y="72" width="144" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="72" width="144" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="78" width="32" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="64" y="87" fill="rgba(90,101,128,0.80)" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="112" y="99" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Закладки Chrome</text>
        <text x="112" y="113" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">HTML · JSON</text>

        <!-- 2. Parser (backend) -->
        <rect x="224" y="72" width="128" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="224" y="72" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="232" y="78" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="254" y="87" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PARSER</text>
        <text x="288" y="99" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Парсер</text>
        <text x="288" y="113" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">regex · JSON tree</text>

        <!-- 3. Bookmarks State (focal + store) ★ -->
        <rect x="392" y="64" width="168" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="64" width="168" height="60" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="400" y="70" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="420" y="79" fill="rgba(191,69,32,0.80)" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="476" y="93" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Состояние закладок</text>
        <text x="476" y="109" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">[]Bookmark</text>

        <!-- 4. Web Server (backend) -->
        <rect x="600" y="72" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="72" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="608" y="78" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="630" y="87" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SERVER</text>
        <text x="680" y="99" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Веб-сервер</text>
        <text x="680" y="113" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">:8080 · 12 handlers</text>

        <!-- 5. Browser (external) -->
        <rect x="800" y="72" width="120" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="72" width="120" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="808" y="78" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
        <text x="828" y="87" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="860" y="99" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Браузер</text>
        <text x="860" y="113" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">HTMX · PicoCSS</text>

        <!-- 6. Duplicates (backend) -->
        <rect x="176" y="248" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="176" y="248" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="184" y="254" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="206" y="263" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ANALYZE</text>
        <text x="244" y="275" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Дубликаты</text>
        <text x="244" y="289" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">NormalizeURL</text>

        <!-- 7. Link Checker (backend) -->
        <rect x="336" y="248" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="336" y="248" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="344" y="254" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="366" y="263" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ANALYZE</text>
        <text x="404" y="275" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Битые ссылки</text>
        <text x="404" y="289" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">HEAD→GET · x10</text>

        <!-- 8. Categorizer (backend) -->
        <rect x="496" y="248" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="496" y="248" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="504" y="254" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="526" y="263" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ANALYZE</text>
        <text x="564" y="275" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Категории</text>
        <text x="564" y="289" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">Domain → Rule</text>

        <!-- 9. Structure (backend) -->
        <rect x="656" y="248" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="656" y="248" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="664" y="254" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="686" y="263" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ANALYZE</text>
        <text x="724" y="275" fill="#2d3142" font-size="12" font-weight="700" font-family="'PT Sans', system-ui, sans-serif" text-anchor="middle">Структура</text>
        <text x="724" y="289" fill="#4f5d75" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle">depth · count</text>

        <!-- ═══════════════════════════════════════════════════════════ -->
        <!-- LEGEND (bottom strip)                                      -->
        <!-- ═══════════════════════════════════════════════════════════ -->

        <rect x="40" y="532" width="880" height="1" fill="rgba(45,49,66,0.12)"/>

        <!-- Backend -->
        <rect x="280" y="552" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
        <text x="302" y="562" fill="#4f5d75" font-size="7" font-family="'PT Mono', ui-monospace, monospace" letter-spacing="0.14em">КОМПОНЕНТ</text>

        <!-- Input -->
        <rect x="392" y="552" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="0.8"/>
        <text x="414" y="562" fill="#4f5d75" font-size="7" font-family="'PT Mono', ui-monospace, monospace" letter-spacing="0.14em">ИСТОЧНИК</text>

        <!-- Store -->
        <rect x="504" y="552" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="526" y="562" fill="#4f5d75" font-size="7" font-family="'PT Mono', ui-monospace, monospace" letter-spacing="0.14em">ХРАНИЛИЩЕ</text>

        <!-- Focal -->
        <rect x="620" y="552" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="0.8"/>
        <text x="642" y="562" fill="#4f5d75" font-size="7" font-family="'PT Mono', ui-monospace, monospace" letter-spacing="0.14em">ЦЕНТР</text>

        <!-- Arrow accent -->
        <line x1="704" y1="558" x2="728" y2="558" stroke="#bf4520" stroke-width="1"/>
        <text x="734" y="562" fill="#4f5d75" font-size="7" font-family="'PT Mono', ui-monospace, monospace" letter-spacing="0.14em">ГЛАВНЫЙ ПОТОК</text>

        <!-- Arrow muted -->
        <line x1="40" y1="558" x2="64" y2="558" stroke="#4f5d75" stroke-width="1"/>
        <text x="70" y="562" fill="#4f5d75" font-size="7" font-family="'PT Mono', ui-monospace, monospace" letter-spacing="0.14em">ПОТОК ДАННЫХ</text>

        <!-- Arrow link dashed -->
        <line x1="152" y1="558" x2="176" y2="558" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="182" y="562" fill="#4f5d75" font-size="7" font-family="'PT Mono', ui-monospace, monospace" letter-spacing="0.14em">HTTP / UI</text>

      </svg>
    </div>
  </div>
</body>
</html>
